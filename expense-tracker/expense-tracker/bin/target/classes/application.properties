# ---------------------------------------------------
# Server
# ---------------------------------------------------
server.port=8080

# ---------------------------------------------------
# H2 file-based database (data persists in ./data folder, no setup needed)
# ---------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/expensetracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console (browse the DB at /h2-console during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------
# File upload limits (not currently used, reserved for receipts)
# ---------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------
# Where generated Excel exports are written on disk
# ---------------------------------------------------
app.export.directory=./exports
